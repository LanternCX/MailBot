name: Go checks and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [linux-x64, linux-arm64, macos-arm64, windows-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: go run ./cmd/package --variant ${{ matrix.name }} --tag "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: mailbot-${{ matrix.name }}
          path: dist/mailbot-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mailbot-*
          path: release_assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.zip
          draft: true
          generate_release_notes: true
